<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Agent-Haus</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Silkscreen&family=VT323&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #070b18; --panel: #0f1629; --line: #22304f; --text: #dfe6f5; --muted: #8492b3;
    --accent: #6ea8ff; --working: #6ee7a8; --waiting: #ffd166; --done: #8492b3; --gone: #4a5675;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 14px/1.45 system-ui, sans-serif;
         display: flex; flex-direction: column; }
  header { display: flex; align-items: center; gap: 14px; padding: 10px 16px; border-bottom: 1px solid var(--line);
           flex-wrap: wrap; }
  h1 { font: 16px Silkscreen, monospace; margin: 0; letter-spacing: .5px; }
  #tabs { display: flex; gap: 6px; flex-wrap: wrap; }
  #tabs button { display: flex; align-items: center; gap: 6px; background: transparent; color: var(--muted);
                 border: 1px solid var(--line); border-radius: 6px; padding: 3px 9px; font: 12px system-ui, sans-serif;
                 cursor: pointer; }
  #tabs button.on { color: var(--text); border-color: var(--accent); }
  #conn { color: var(--muted); font-size: 12px; }
  #conn.on { color: var(--working); }
  header a { margin-left: auto; color: var(--muted); font-size: 12px; }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--muted); flex: none; display: inline-block; }
  .dot.working { background: var(--working); box-shadow: 0 0 6px var(--working); }
  .dot.waiting { background: var(--waiting); }
  .dot.done, .dot.gone { background: var(--gone); }

  .layout { flex: 1; min-height: 0; display: grid; grid-template-columns: 1fr 340px; }
  #stage { overflow: auto; display: flex; justify-content: center; align-items: flex-start; padding: 12px; }
  #view { display: block; image-rendering: pixelated; }
  aside { border-left: 1px solid var(--line); background: var(--panel); overflow: auto; padding: 16px; }

  .p-head { display: flex; gap: 12px; align-items: center; margin-bottom: 12px; }
  #avatar { width: 64px; height: 64px; image-rendering: pixelated; background: #141b33; border-radius: 8px; flex: none; }
  #p-name { font: 15px Silkscreen, monospace; margin: 0 0 4px; }
  #p-meta { display: flex; align-items: center; gap: 6px; color: var(--muted); font-size: 12px; }
  dl { margin: 0 0 12px; display: grid; grid-template-columns: 82px 1fr; gap: 4px 10px; font-size: 13px; }
  dt { color: var(--muted); }
  dd { margin: 0; word-break: break-word; }
  h3 { font: 11px Silkscreen, monospace; color: var(--muted); margin: 14px 0 6px; letter-spacing: .5px; }
  #p-result { font-size: 13px; white-space: pre-wrap; word-break: break-word; margin: 0; color: var(--text); }
  #p-log { list-style: none; margin: 0; padding: 0; font: 12px/1.5 ui-monospace, monospace; color: var(--muted); }
  #p-log li { padding: 1px 0; word-break: break-word; }
  #p-log time { color: var(--gone); margin-right: 6px; }
  .hint { color: var(--muted); }

  @media (max-width: 900px) {
    html, body { height: auto; }
    .layout { grid-template-columns: 1fr; }
    #stage { overflow-x: auto; padding: 8px 0; }
    aside { border-left: 0; border-top: 1px solid var(--line); }
  }
</style>
</head>
<body>
<header>
  <h1>Agent-Haus</h1>
  <nav id="tabs"></nav>
  <span id="conn">verbinde …</span>
  <a href="/text.html">Textansicht</a>
</header>
<div class="layout">
  <div id="stage"><canvas id="view"></canvas></div>
  <aside id="panel">
    <p class="hint">Noch keine Session. Starte <code>claude</code> im Ordner <code>~/agent-haus</code>.</p>
  </aside>
</div>
<script src="/haus.js"></script>
</body>
</html>
