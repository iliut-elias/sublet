<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sublet</title>
<style>
  /* Pixel fonts shipped with the app (SIL Open Font License, see fonts/OFL-*.txt) */
  @font-face { font-family: Silkscreen; src: url("/fonts/Silkscreen-Regular.ttf") format("truetype"); font-display: swap; }
  @font-face { font-family: VT323; src: url("/fonts/VT323-Regular.ttf") format("truetype"); font-display: swap; }
  :root {
    --bg: #060914; --panel: rgba(13, 19, 38, 0.985); --line: #26355a; --text: #dfe6f5; --muted: #8e9cbd;
    --accent: #6ea8ff; --working: #6ee7a8; --waiting: #ffd166; --gone: #5a6688;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; overflow: hidden; }
  body { background: var(--bg); color: var(--text); font: 14px/1.45 system-ui, sans-serif; }

  /* scene across the whole screen */
  #view { position: fixed; inset: 0; display: block; image-rendering: pixelated; }
  #overlay { position: fixed; inset: 0; pointer-events: none; overflow: hidden; }

  /* header floats above the sky */
  header { position: fixed; top: 0; left: 0; right: 0; z-index: 2; display: flex; align-items: center; gap: 14px;
           padding: 10px 16px 18px; flex-wrap: wrap;
           background: linear-gradient(rgba(6, 9, 20, 0.85), rgba(6, 9, 20, 0)); }
  h1 { font: 16px Silkscreen, monospace; margin: 0; letter-spacing: .5px; }
  #tabs { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
  #tabs button { display: flex; align-items: center; gap: 6px; background: rgba(13, 19, 38, 0.7); color: var(--muted);
                 border: 1px solid var(--line); border-radius: 6px; padding: 3px 9px; font: 12px system-ui, sans-serif;
                 cursor: pointer; }
  #tabs button.on { color: var(--text); border-color: var(--accent); }
  #tabs .hint { color: var(--muted); font-size: 12px; }
  #conn { color: var(--muted); font-size: 12px; }
  #conn.on { color: var(--working); }
  header a { color: var(--muted); font-size: 12px; }
  .hbtn { background: rgba(13, 19, 38, 0.7); color: var(--muted); border: 1px solid var(--line); border-radius: 6px;
          padding: 3px 9px; font: 12px system-ui, sans-serif; cursor: pointer; }
  .hbtn:hover, .hbtn[aria-pressed="true"] { color: var(--text); border-color: var(--accent); }
  #replayBtn { margin-left: auto; }
  .menu { position: fixed; z-index: 4; top: 48px; right: 16px; width: 360px; max-width: calc(100vw - 32px);
          max-height: 70vh; overflow: auto; background: var(--panel); border: 1px solid var(--line); border-radius: 10px;
          padding: 10px; box-shadow: 0 12px 40px rgba(0, 0, 0, 0.45); }
  .menu h4 { display: flex; justify-content: space-between; align-items: center; margin: 2px 4px 8px;
             font: 11px Silkscreen, monospace; color: var(--muted); letter-spacing: .5px; }
  .menu select { background: #141b33; color: var(--text); border: 1px solid var(--line); border-radius: 6px; padding: 2px 6px; }
  .menu .item { display: block; width: 100%; text-align: left; background: transparent; border: 0; color: var(--text);
                padding: 6px 8px; border-radius: 6px; cursor: pointer; font: 13px system-ui, sans-serif; }
  .menu .item:hover, .menu .item:focus-visible { background: rgba(110, 168, 255, 0.12); outline: none; }
  .menu .sub { color: var(--muted); font-size: 12px; }
  #permBtn[aria-pressed="true"] { color: #141826; background: var(--waiting); border-color: var(--waiting); }

  /* permission cards */
  #perms { position: fixed; z-index: 5; left: 0; right: 0; bottom: 16px; margin: 0 auto; width: min(480px, calc(100vw - 32px));
           display: flex; flex-direction: column; gap: 8px; pointer-events: none; }
  .perm { pointer-events: auto; background: var(--panel); border: 2px solid var(--waiting); border-radius: 10px; padding: 12px 14px;
          box-shadow: 0 12px 40px rgba(0, 0, 0, 0.5); }
  .perm-title { font-size: 14px; margin-bottom: 6px; cursor: pointer; }
  .perm-title b { font: 13px Silkscreen, monospace; color: var(--waiting); margin-right: 4px; }
  .perm code { display: block; font: 12px/1.45 ui-monospace, monospace; background: #0a0f1f; color: #dfe6f5; padding: 6px 8px;
               border-radius: 6px; white-space: pre-wrap; word-break: break-all; max-height: 160px; overflow: auto; }
  .perm-where { color: var(--muted); font-size: 12px; margin-top: 6px; }
  .perm-actions { display: flex; gap: 8px; align-items: center; margin-top: 10px; }
  .perm-actions button { border: 0; border-radius: 6px; padding: 6px 14px; font: 600 13px system-ui, sans-serif; cursor: pointer; }
  .perm-actions .allow { background: var(--working); color: #0b1a12; }
  .perm-actions .deny { background: #e85d5d; color: #1a0b0b; }
  .perm-actions button:disabled { opacity: .5; cursor: default; }
  .perm-actions .left { margin-left: auto; color: var(--muted); font-size: 12px; font-variant-numeric: tabular-nums; }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--muted); flex: none; display: inline-block; }
  .dot.working { background: var(--working); box-shadow: 0 0 6px var(--working); }
  .dot.waiting { background: var(--waiting); }
  .dot.done, .dot.gone { background: var(--gone); }

  /* texts in the house (HTML instead of canvas, so they stay sharp) */
  .lbl { position: absolute; left: 0; top: 0; white-space: nowrap; }
  .plaque { font-family: Silkscreen, monospace; color: #dfe6f5; background: rgba(10, 14, 28, 0.88); line-height: 1; }
  .plaque.gold { color: #ffd166; }
  .plaque.sz-s, .plaque.sz-m { font-size: 8px; padding: 3px 4px 2px; }
  .plaque.sz-l { font-size: 16px; padding: 4px 6px 3px; }
  .zzz { font-family: Silkscreen, monospace; color: #9fb0d8; line-height: 1; }
  .zzz.sz-s, .zzz.sz-m { font-size: 8px; }
  .zzz.sz-l { font-size: 16px; }
  .bubble { font-family: VT323, monospace; line-height: 1; color: #141826; background: #eef2ff;
            border: 2px solid #141826; padding: 1px 6px 2px; box-shadow: 2px 2px 0 rgba(0, 0, 0, 0.35); }
  .bubble.sz-s { font-size: 16px; }
  .bubble.sz-m { font-size: 20px; }
  .bubble.sz-l { font-size: 22px; }
  .bubble.say { background: #cfe0ff; }
  .bubble.waiting { background: #ffd166; }
  .bubble::after { content: ""; position: absolute; top: 100%; left: var(--tx, 50%); width: 4px; height: 4px;
                   background: #141826; box-shadow: 2px 2px 0 #141826; }

  /* panel: floating card, opens with a click on a room */
  #panel { position: fixed; z-index: 3; right: 16px; top: 56px; bottom: 16px; width: 340px; display: none;
           overflow: auto; padding: 16px; background: var(--panel); border: 1px solid var(--line); border-radius: 12px;
           box-shadow: 0 12px 40px rgba(0, 0, 0, 0.45); }
  #panel.open { display: block; }
  #panel .close { position: sticky; top: 0; float: right; margin: -6px -6px 0 0; width: 28px; height: 28px;
                  background: transparent; color: var(--muted); border: 1px solid var(--line); border-radius: 6px;
                  font-size: 18px; line-height: 1; cursor: pointer; }
  #panel .close:hover { color: var(--text); border-color: var(--accent); }
  .p-head { display: flex; gap: 12px; align-items: center; margin-bottom: 12px; }
  #avatar { width: 64px; height: 64px; image-rendering: pixelated; background: #141b33; border-radius: 8px; flex: none; }
  #p-name { font: 15px Silkscreen, monospace; margin: 0 0 4px; }
  #p-meta { display: flex; align-items: center; gap: 6px; color: var(--muted); font-size: 12px; }
  dl { margin: 0 0 12px; display: grid; grid-template-columns: 82px 1fr; gap: 4px 10px; font-size: 13px; }
  dt { color: var(--muted); }
  dd { margin: 0; word-break: break-word; }
  h3 { font: 11px Silkscreen, monospace; color: var(--muted); margin: 14px 0 6px; letter-spacing: .5px; }
  #p-result { font-size: 13px; white-space: pre-wrap; word-break: break-word; margin: 0; }
  #p-log { list-style: none; margin: 0; padding: 0; font: 12px/1.5 ui-monospace, monospace; color: var(--muted); }
  #p-log li { padding: 1px 0; word-break: break-word; }
  #p-log time { color: #7482a6; margin-right: 6px; }
  .hint { color: var(--muted); }
  .gone-list { display: flex; flex-wrap: wrap; gap: 6px; }
  .gone { background: #141b33; color: var(--text); border: 1px solid var(--line); border-radius: 6px; padding: 3px 9px;
          font: 12px Silkscreen, monospace; cursor: pointer; }
  .gone:hover { border-color: var(--accent); }

  @media (max-width: 700px) {
    #panel { left: 8px; right: 8px; top: auto; bottom: 8px; width: auto; max-height: 55vh; }
  }
</style>
</head>
<body>
<canvas id="view" data-i18n-label="page.label" role="img"></canvas>
<div id="overlay" aria-hidden="true"></div>
<header>
  <h1>Sublet</h1>
  <nav id="tabs"></nav>
  <span id="conn" aria-live="polite" data-i18n="conn.connecting"></span>
  <button id="replayBtn" class="hbtn" type="button" aria-haspopup="true" data-i18n="btn.replay"></button>
  <button id="notifyBtn" class="hbtn" type="button" aria-pressed="false" data-i18n-title="btn.notify.title"></button>
  <button id="permBtn" class="hbtn" type="button" aria-pressed="false" data-i18n-title="btn.perm.title"></button>
  <button id="sound" class="hbtn" type="button" data-i18n-title="btn.sound.title"></button>
  <a href="/text.html" data-i18n="link.text"></a>
</header>
<aside id="panel"></aside>
<div id="replayMenu" class="menu" hidden></div>
<div id="perms" aria-live="assertive"></div>
<script src="/i18n.js"></script>
<script src="/haus.js"></script>
</body>
</html>
